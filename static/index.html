<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Founder Insights Agent</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e8e9ec;
    --muted: #9aa1ac;
    --accent: #5b8cff;
    --warn-bg: #241d10;
    --warn-border: #4a3a12;
    --warn-text: #e8c780;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .app {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 20px 16px 12px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 17px; margin: 0 0 2px; }
  header p { font-size: 13px; color: var(--muted); margin: 0; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; line-height: 1.45; white-space: pre-wrap; font-size: 14.5px; }
  .msg.user { align-self: flex-end; background: var(--accent); color: white; }
  .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .msg.loading { align-self: flex-start; color: var(--muted); font-style: italic; }
  .msg.coldstart {
    align-self: flex-start;
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    color: var(--warn-text);
    font-style: normal;
  }
  .msg.coldstart .title { font-weight: 600; margin-bottom: 4px; }
  .msg.coldstart .elapsed { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
  form {
    display: flex;
    gap: 8px;
    padding: 12px 16px 18px;
    border-top: 1px solid var(--border);
  }
  input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 14.5px;
  }
  input:focus { outline: 1px solid var(--accent); }
  button {
    padding: 0 18px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Founder Insights Agent</h1>
    <p>Ask about revenue, pipeline health, sector performance, or operations across Work Orders + Deals.</p>
  </header>
  <div id="messages"></div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="e.g. How's our pipeline looking for energy sector this quarter?" />
    <button type="submit" id="send">Send</button>
  </form>
</div>

<script>
  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  let history = [];

  // This app runs on a free hosting tier that spins the server down after
  // ~15 minutes of inactivity. The first request after a sleep period can
  // take 30-60s to get a response while the server cold-starts. Rather than
  // let that look like a hang or a bug, we detect a slow-starting request
  // and swap in an explanatory message with a live elapsed timer. Once any
  // request has completed, the server is known to be warm, so we stop
  // showing this for the rest of the session.
  const COLD_START_DELAY_MS = 5000; // how long to wait before assuming cold start
  let serverConfirmedWarm = false;

  function addMessage(text, cls) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function addColdStartMessage() {
    const div = document.createElement("div");
    div.className = "msg coldstart";
    div.innerHTML =
      '<div class="title">Waking up the server…</div>' +
      '<div>This app runs on a free hosting tier that sleeps after periods ' +
      'of inactivity. First response may take up to a minute — thanks for ' +
      'your patience. Subsequent messages will be fast.</div>' +
      '<div class="elapsed">0s elapsed</div>';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    const elapsedEl = div.querySelector(".elapsed");
    const startedAt = Date.now();
    const interval = setInterval(() => {
      const secs = Math.floor((Date.now() - startedAt) / 1000);
      elapsedEl.textContent = secs + "s elapsed";
    }, 1000);

    return { el: div, stop: () => clearInterval(interval) };
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    addMessage(text, "user");
    input.value = "";
    sendBtn.disabled = true;

    const loadingEl = addMessage("Querying monday.com and thinking…", "loading");

    let coldStart = null;
    let coldStartTimer = null;
    if (!serverConfirmedWarm) {
      coldStartTimer = setTimeout(() => {
        loadingEl.remove();
        coldStart = addColdStartMessage();
      }, COLD_START_DELAY_MS);
    }

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, history }),
      });
      const data = await res.json();

      clearTimeout(coldStartTimer);
      serverConfirmedWarm = true;
      loadingEl.remove();
      if (coldStart) {
        coldStart.stop();
        coldStart.el.remove();
      }

      addMessage(data.reply, "assistant");
      history = data.history;
    } catch (err) {
      clearTimeout(coldStartTimer);
      loadingEl.remove();
      if (coldStart) {
        coldStart.stop();
        coldStart.el.remove();
      }
      addMessage("Something went wrong talking to the server: " + err, "assistant");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
